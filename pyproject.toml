[project]
name = "cassis-cli"
version = "1.2.0"
description = "Cassis CLI — run Cassis actions (ontology validation, upload and publish) from your CI pipelines"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Cassis", email = "tech.admin@getcassis.com" }]
keywords = ["cassis", "ontology", "ci", "text-to-sql"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
# Customer CI images — keep this floor low and the code 3.10-compatible,
# regardless of the monorepo's own Python pin.
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer (>=0.12,<1.0)",
    "httpx (>=0.24,<1.0)",
]

[project.urls]
Homepage = "https://getcassis.com"
Repository = "https://github.com/GetCassis/cassis-cli"
Documentation = "https://github.com/GetCassis/cassis-cli#readme"

[project.scripts]
cassis = "cassis_cli.main:app"

[tool.poetry]
packages = [{ include = "cassis_cli" }]
# Ship the bundled modeling guide (non-.py data) in the wheel/sdist — the CLI
# reads it at runtime to write <base_path>/AGENTS.md.
include = [{ path = "cassis_cli/ontology_design_guide.md", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
